name: Scientific guardrails
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit original six unapproved candidates
        run: python run_pipeline.py --mode audit --input data/candidates_UNAPPROVED.csv --output-dir outputs
      - name: Audit original Mount fitted endpoints, transformations, CI envelopes, and deduplication
        run: python src/transhazard/evidence_audit.py --report outputs/expanded_evidence_audit.json
      - name: Audit 17 proposed chemical identities and 11 environmental pathways
        run: python src/transhazard/identity_review.py --report outputs/identity_pathway_gate.json --molar outputs/xiong2023_molar_PROVISIONAL_NOT_APPROVED.csv
      - name: Audit Li 2026 and Yuan 2023 supplemental recovery hold states
        run: python src/transhazard/new_sources_gate.py --report outputs/new_source_recovery_gate.json
      - name: Unapproved data must never enter empirical model training
        shell: bash
        run: |
          set +e
          python run_pipeline.py --mode train --input data/candidates_UNAPPROVED.csv --output-dir outputs
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then echo "Expected NO-GO exit 2, got $rc"; exit 1; fi
          python -c "import json; d=json.load(open('outputs/model_gate.json')); assert d['model_status']=='NOT_TRAINED' and d['scientific_release_status']=='NO_GO'"
      - name: Upload scientific audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dataset-v2-provisional-audit
          path: |
            outputs/candidate_audit.json
            outputs/expanded_evidence_audit.json
            outputs/identity_pathway_gate.json
            outputs/xiong2023_molar_PROVISIONAL_NOT_APPROVED.csv
            outputs/model_gate.json
            outputs/new_source_recovery_gate.json
