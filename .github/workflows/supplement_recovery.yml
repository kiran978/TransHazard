name: Retrieve public supporting-information PDFs (metadata only)
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/try_recover_supplements.py
      - .github/workflows/supplement_recovery.yml
jobs:
  source_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF reader
        run: python -m pip install "pypdf>=5,<7"
      - name: Probe source publishers without publishing copyrighted PDFs
        run: python scripts/try_recover_supplements.py
